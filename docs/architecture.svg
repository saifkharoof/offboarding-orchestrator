<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" role="img" aria-labelledby="offb-arch-title offb-arch-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="offb-arch-title">Offboarding orchestrator architecture</title>
      <desc id="offb-arch-desc">A CLI and API both call one RunService, which drives a LangGraph workflow through an LLM planning step and a tool executor, and owns the run's lifecycle directly in SQLite. The graph's own checkpointer and our own run/trace/ledger tables share one SQLite file as two separate stores. A human approver and an external signed-document event re-enter through the same CLI/API path to resume the graph's two pause points.</desc>
