[project]
name = "offboarding-orchestrator"
version = "0.1.0"
description = "Durable agent orchestration layer for employee offboarding"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
offboarding = "offboarding.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["offboarding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
